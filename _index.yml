indexpage:
  title: ONTAP Dokumentation zum Importieren fremder LUNs
  keywords: fli, ontap, array, fli-based, configuration, lun, import, san, migration,
    foreign
  lead: Foreign LUN Import (FLI) ist eine ONTAP-Funktion, die eine Datenmigration
    auf Blockebene (LUN) ermöglicht, indem Benutzerdaten von einer externen Array-LUN
    in eine ONTAP-LUN kopiert werden. ONTAP führt die Migration durch, indem es als
    SCSI-Initiator fungiert, der von der externen LUN liest und in die Ziel-ONTAP-LUN
    schreibt.
